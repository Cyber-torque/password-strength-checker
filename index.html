<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Password Strength Checker</title>

	<link rel="stylesheet" href="style.css">
	
</head>
<body>
	<main class="card">
	<h1>Password Strength Checker</h1>
	<p class="note">Your password never leaves your browser.</p>
		<label for="password">Enter a password</label>
		<div class="input-row">
			<input type="password" id="password" autocomplete="off" placeholder="Type here...">
			<button id="toggle" type="button">Show</button>
		</div>

		<div><div id="meter-bar"></div></div>
			<p id="strength-label">Strength: -</p>
			<button id="breach-btn" type="button">Check for breaches</button>
			<p id="breach-result"></p>
			<ul id="feedback"></ul> 
		
		</main>
		<script src="script.js"></script>
</body>
</html>
